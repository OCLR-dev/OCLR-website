<style>
/* MainSheet tokens copied from src/app/public-tournament.css (light / dark). */
:root {
  --site-background: #f4f1f7; --site-surface: #fff; --site-raised: #f8f4fb; --site-tint: #ece5f3;
  --site-foreground: #1b1422; --site-muted: #6d6278; --site-secondary-text: #453a50;
  --site-accent: #6c2e91; --site-accent-strong: #552074; --site-border: #ded5e7;
  --site-control-border: #cec2da; --site-header: #fdfcfe; --site-success: #17644b;
  --site-warning: #875505; --site-danger: #a4254a; --site-focus: #a52773;
  --site-highlight: #ae2679; --site-shadow: #31113b18; --site-on-primary: #fff;
  --site-primary: #6c2e91; --site-primary-hover: #552074;
  --text-label: 0.75rem; --text-support: 0.8125rem; --text-small: 0.875rem;
  --text-body: 1rem; --text-heading: 1.25rem;
  --board: #e6e3ea; --board-ink: #2b2530; --note: #fff7d6; --note-ink: #5a4500;
  color-scheme: light;
}
html[data-theme="dark"] {
  --site-background: #090c17; --site-surface: #121626; --site-raised: #191d30; --site-tint: #282039;
  --site-foreground: #f4f3fc; --site-muted: #b8b3ca; --site-secondary-text: #d4cce1;
  --site-accent: #dba5f7; --site-accent-strong: #e8c3ff; --site-border: #363044;
  --site-control-border: #685475; --site-header: #0e1120; --site-success: #72e3bc;
  --site-warning: #f0cb83; --site-danger: #ff9eaf; --site-focus: #e3a6ef;
  --site-highlight: #efa5d6; --site-shadow: #0004; --site-on-primary: #fff;
  --site-primary: #713299; --site-primary-hover: #8740b2;
  --board: #1d1b22; --board-ink: #e9e5ef; --note: #3a3218; --note-ink: #f3dd9a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--board); color: var(--board-ink);
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
}
:focus-visible { outline: 2px solid var(--site-focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Board chrome (annotation layer, not product UI) */
.board-bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center;
  padding: 12px 24px; background: var(--board); border-bottom: 1px solid #0002; }
.board-bar h1 { font-size: 16px; margin: 0; }

.board-bar select, .board-bar button { font: inherit; padding: 4px 8px; }
.board { padding: 24px; display: grid; gap: 48px; }
.board-section > h2 { font-size: 18px; margin: 0 0 4px; }
.board-section > p.lede { margin: 0 0 16px; max-width: 72ch; opacity: .85; }
.frames { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
.frame-wrap > .frame-label { font-size: 12px; font-family: ui-monospace, Menlo, monospace; margin-bottom: 6px; opacity: .8; }
.frame { container-type: inline-size; background: var(--site-background); color: var(--site-foreground);
  border: 1px solid #0003; border-radius: 12px; overflow: hidden; }
.frame.desktop { width: 1200px; }
.frame.mobile { width: 390px; }
.note { background: var(--note); color: var(--note-ink); border-radius: 8px; padding: 8px 12px; font-size: 12px; max-width: 72ch; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, 400px); gap: 24px 32px; }
.gallery figure { margin: 0; }
.gallery figcaption { font-size: 12px; margin-bottom: 6px; }
.gallery figcaption code { font-weight: 700; }
.gallery .frame { padding: 12px; }

/* Fake site chrome. Mirrors .event-context and the public TournamentNavigation
   (mobileMenu list) in src/components/tournament-navigation.tsx and public-tournament.css. */
.site-top { display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: var(--site-header);
  border-bottom: 1px solid var(--site-border); font-size: var(--text-support); color: var(--site-muted); }
.site-top b { color: var(--site-accent); font-size: 15px; }
.ctx { position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px;
  padding: 12px 24px; border-bottom: 1px solid var(--site-border); }
.ctx .crumb { flex: 1 1 14rem; min-width: 0; font-size: var(--text-small); color: var(--site-muted); }
.ctx .crumb b { color: var(--site-foreground); font-weight: 650; }
.ctx nav { display: flex; flex-wrap: nowrap; gap: 4px; padding: 4px; border-radius: 1.5rem; background: var(--site-tint); max-width: 100%; }
.ctx nav a { display: flex; align-items: center; min-height: 44px; padding: 8px 14px; border-radius: 999px; white-space: nowrap;
  font-size: var(--text-small); font-weight: 600; color: var(--site-muted); text-decoration: none; }
.ctx nav a[aria-current] { background: var(--site-surface); color: var(--site-accent); box-shadow: 0 2px 6px var(--site-shadow); }
.ctx nav a[aria-current]::before { content: ""; width: 6px; height: 6px; margin-right: 7px; border-radius: 50%; background: var(--site-highlight); }
.ctx .menu-btn { display: none; }
@container (max-width: 52rem) {
  .site-top, .ctx { padding-inline: 16px; }
  .ctx { flex-wrap: nowrap; }
  .ctx nav { display: none; position: absolute; z-index: 5; top: 100%; right: 16px; width: min(24rem, calc(100% - 32px)); margin-top: 8px; padding: 8px;
    border: 1px solid var(--site-control-border); border-radius: 1rem; background: var(--site-surface); box-shadow: 0 8px 24px var(--site-shadow); }
  .ctx[data-open] nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ctx nav a { white-space: normal; overflow-wrap: anywhere; }
  .ctx .menu-btn { display: inline-flex; flex: none; gap: 16px; }
}

/* Shared controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 10px 16px;
  border-radius: 0.45rem; border: 1px solid transparent; font: inherit; font-size: var(--text-support); font-weight: 600; cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--site-primary); color: var(--site-on-primary); }
.btn.primary:hover { background: var(--site-primary-hover); }
.btn.secondary { background: var(--site-surface); color: var(--site-accent); border-color: var(--site-control-border); }
.btn[aria-disabled="true"] { background: var(--site-tint); color: var(--site-muted); border-color: var(--site-border); cursor: default; }
.btn[aria-busy="true"] { opacity: .8; cursor: progress; }
.link { background: none; border: 0; padding: 0; font: inherit; color: var(--site-accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.muted { color: var(--site-muted); }
.small { font-size: var(--text-support); }
.label { font-size: var(--text-label); color: var(--site-muted); }
svg.i { width: 14px; height: 14px; flex: none; vertical-align: -2px; }

/* Pick'em page */
.pk { padding: 24px; }
@container (max-width: 760px) { .pk { padding: 16px; } }
.pk-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
.pk-head h1 { margin: 0; font-size: 1.75rem; line-height: 1.2; }
.pk-head .rules { margin-left: auto; min-height: 44px; }
.pk-intro { margin: 8px 0 0; color: var(--site-secondary-text); font-size: var(--text-small); max-width: 60ch; }
.pk-tabs { display: flex; gap: 4px; margin: 20px 0 0; border-bottom: 1px solid var(--site-border); overflow-x: auto; }
.pk-tabs a { padding: 10px 14px; font-size: var(--text-small); color: var(--site-muted); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; }
.pk-tabs a[aria-current] { color: var(--site-accent); border-bottom-color: var(--site-accent); font-weight: 600; }
.pk-filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 16px 0; }
.pk-filters select { font: inherit; font-size: var(--text-support); min-height: 40px; padding: 6px 10px; border-radius: 0.45rem;
  border: 1px solid var(--site-control-border); background: var(--site-surface); color: var(--site-foreground); }
.chips { display: flex; gap: 6px; overflow-x: auto; }
.chips button { font: inherit; font-size: var(--text-support); min-height: 36px; padding: 6px 12px; border-radius: 999px; white-space: nowrap;
  border: 1px solid var(--site-control-border); background: var(--site-surface); color: var(--site-muted); cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--site-tint); color: var(--site-accent); border-color: var(--site-accent); font-weight: 600; }
.pk-count { margin-left: auto; font-size: var(--text-support); color: var(--site-muted); }
@container (max-width: 760px) {
  .pk-filters { flex-wrap: nowrap; flex-direction: column; align-items: stretch; }
  .pk-filters .pk-count { margin-left: 0; }
}
.pk-layout { display: grid; gap: 24px; }
@container (min-width: 900px) { .pk-layout { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; } .pk-aside { position: sticky; top: 16px; } }
.pk-list { display: grid; gap: 16px; }
.pk-group-title { margin: 8px 0 -4px; font-size: var(--text-label); letter-spacing: .04em; color: var(--site-muted); font-weight: 600; }

/* Fixture card */
.pk-card { background: var(--site-surface); border: 1px solid var(--site-control-border); border-radius: 0.6rem; box-shadow: 0 4px 12px var(--site-shadow); }
.pk-card-body { padding: 16px; display: grid; gap: 12px; }
.pk-card-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.pk-card-head h3 { margin: 0; font-size: var(--text-support); font-weight: 600; color: var(--site-accent); }
.pk-times { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--text-support); color: var(--site-secondary-text); }
.pk-times .rel { color: var(--site-muted); }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: var(--text-label); font-weight: 600; white-space: nowrap;
  border: 1px solid currentColor; }
.badge[data-tone="accent"] { color: var(--site-accent); }
.badge[data-tone="success"] { color: var(--site-success); }
.badge[data-tone="warning"] { color: var(--site-warning); }
.badge[data-tone="danger"] { color: var(--site-danger); }
.badge[data-tone="muted"] { color: var(--site-muted); }
fieldset.pk-options { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: stretch; }
fieldset.pk-options.has-draw { grid-template-columns: minmax(0,1fr) minmax(0,.7fr) minmax(0,1fr); }
.pk-vs { align-self: center; font-size: var(--text-label); color: var(--site-muted); padding: 0 4px; }
.pk-option { display: grid; grid-template-columns: auto auto minmax(0,1fr); gap: 10px; align-items: center; min-height: 52px; padding: 10px 12px;
  border: 1px solid var(--site-control-border); border-radius: 0.6rem; background: var(--site-surface); cursor: pointer; }
.pk-option:hover { border-color: var(--site-accent); }
.pk-option input { margin: 0; accent-color: var(--site-accent); width: 18px; height: 18px; }
.pk-option:has(input:focus-visible) { outline: 2px solid var(--site-focus); outline-offset: 2px; }
.pk-option:has(input:checked) { border: 2px solid var(--site-accent); padding: 9px 11px; background: var(--site-tint); }
.pk-option:has(input:disabled) { cursor: default; opacity: .75; }
.pk-option .name { overflow-wrap: anywhere; font-weight: 500; line-height: 1.3; }
.pk-option:has(input:checked) .name { font-weight: 700; }
.pk-option.draw { grid-template-columns: auto minmax(0,1fr); justify-items: start; }
.mono { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--site-tint); color: var(--site-accent);
  font-size: 11px; font-weight: 700; flex: none; border: 1px solid var(--site-border); }
@container (max-width: 560px) {
  fieldset.pk-options, fieldset.pk-options.has-draw { grid-template-columns: minmax(0,1fr); }
  .pk-vs { display: none; }
  .pk-option.draw { order: 3; }
}
.pk-foot { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; border-top: 1px solid var(--site-border); padding-top: 12px; }
.pk-foot .msg { font-size: var(--text-support); color: var(--site-secondary-text); display: flex; gap: 6px; align-items: flex-start; flex: 1 1 220px; }
.pk-foot .msg[data-tone="danger"] { color: var(--site-danger); }
.pk-foot .msg[data-tone="success"] { color: var(--site-success); }
.pk-foot .msg[data-tone="warning"] { color: var(--site-warning); }
.pk-foot .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
@container (max-width: 560px) { .pk-foot .actions, .pk-foot .actions .btn { width: 100%; } }
.pk-note { display: flex; gap: 6px; font-size: var(--text-support); padding: 8px 10px; border-radius: 0.45rem; background: var(--site-raised); border: 1px dashed var(--site-control-border); color: var(--site-secondary-text); }
.pk-note[data-tone="warning"] { border-color: var(--site-warning); color: var(--site-warning); }
.pk-live:empty { display: none; }
.pk-live { margin: 0 16px 12px; font-size: var(--text-label); color: var(--site-muted); }

/* Distribution & results */
.pk-dist { display: grid; gap: 8px; }
.pk-dist-row { display: grid; grid-template-columns: minmax(0, 11rem) minmax(60px, 1fr) auto; gap: 4px 12px; align-items: center; font-size: var(--text-support); }
.pk-dist-row .name { overflow-wrap: anywhere; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pk-dist-row .bar { height: 8px; background: var(--site-tint); border-radius: 999px; overflow: hidden; }
.pk-dist-row .bar i { display: block; height: 100%; background: var(--site-accent); border-radius: 999px; }
.pk-dist-row[data-mine] .name { font-weight: 700; }
.pk-dist-row .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pk-dist-row .num small { color: var(--site-muted); margin-left: 4px; }
.tag { display: inline-flex; align-items: center; gap: 3px; font-size: var(--text-label); padding: 0 6px; border-radius: 999px; background: var(--site-tint); color: var(--site-accent); font-weight: 600; white-space: nowrap; }
.tag.win { background: transparent; border: 1px solid var(--site-success); color: var(--site-success); }
@container (max-width: 560px) { .pk-dist-row { grid-template-columns: minmax(0,1fr) auto; } .pk-dist-row .bar { grid-column: 1 / -1; grid-row: 2; } }
.pk-result { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: var(--text-support); }
.score-chip { font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; font-size: var(--text-support); white-space: nowrap; }
.score-chip[data-tone="success"] { color: var(--site-success); }
.score-chip[data-tone="muted"] { color: var(--site-muted); }
.score-chip[data-tone="danger"] { color: var(--site-danger); }

/* Aside */
.panel { background: var(--site-surface); border: 1px solid var(--site-border); border-radius: 0.75rem; padding: 16px; display: grid; gap: 12px; }
.panel + .panel { margin-top: 16px; }
.panel h2 { margin: 0; font-size: var(--text-small); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat b { display: block; font-size: 1.5rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: var(--text-label); color: var(--site-muted); }
.progress { height: 6px; background: var(--site-tint); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--site-accent); }
.mini-board { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: var(--text-support); }
.mini-board li { display: grid; grid-template-columns: 2.5rem minmax(0,1fr) auto; gap: 8px; padding: 6px 8px; border-radius: 0.45rem; align-items: center; }
.mini-board li[data-me] { background: var(--site-tint); box-shadow: inset 3px 0 0 var(--site-accent); font-weight: 600; }
.mini-board li.gap { color: var(--site-muted); grid-template-columns: 1fr; text-align: center; padding: 0; }
.rank { font-variant-numeric: tabular-nums; color: var(--site-muted); }
.rank small { display: block; font-size: 10px; line-height: 1; }

/* Tables (my picks / leaderboard) */
.tbl { width: 100%; border-collapse: collapse; background: var(--site-surface); border: 1px solid var(--site-border); border-radius: 0.6rem; overflow: hidden; font-size: var(--text-support); }
.tbl th { text-align: left; font-size: var(--text-label); color: var(--site-muted); font-weight: 600; padding: 10px 12px; background: var(--site-raised); border-bottom: 1px solid var(--site-border); }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--site-border); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tr[data-me] td { background: var(--site-tint); font-weight: 600; }
.tbl tr[data-me] td:first-child { box-shadow: inset 3px 0 0 var(--site-accent); }
.tbl .teams { overflow-wrap: anywhere; }
.tbl .sub { display: block; color: var(--site-muted); font-size: var(--text-label); font-weight: 400; }
.player { display: inline-flex; gap: 8px; align-items: center; }
.player .mono { width: 24px; height: 24px; font-size: 10px; }
@container (max-width: 640px) {
  .tbl.stack thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .tbl.stack, .tbl.stack tbody, .tbl.stack tr, .tbl.stack td { display: block; width: 100%; }
  .tbl.stack tr { padding: 10px 12px; border-bottom: 1px solid var(--site-border); }
  .tbl.stack td { border: 0; padding: 2px 0; text-align: left; }
  .tbl.stack td[data-label]::before { content: attr(data-label) "　"; color: var(--site-muted); font-size: var(--text-label); font-weight: 400; }
  .tbl.stack td.num { text-align: left; }
}
.lb-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin: 16px 0; }
.seg { display: inline-flex; border: 1px solid var(--site-control-border); border-radius: 999px; padding: 2px; background: var(--site-surface); }
.seg button { font: inherit; font-size: var(--text-support); border: 0; background: none; padding: 6px 14px; border-radius: 999px; color: var(--site-muted); min-height: 36px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--site-tint); color: var(--site-accent); font-weight: 600; }
.switch-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 16px; align-items: start; }
.switch { position: relative; width: 48px; height: 28px; border-radius: 999px; border: 1px solid var(--site-control-border); background: var(--site-tint); cursor: pointer; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--site-muted); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--site-primary); border-color: var(--site-primary); }
.switch[aria-checked="true"]::after { left: 23px; background: #fff; }
@media (prefers-reduced-motion: reduce) { .switch::after { transition: none; } }
.pager { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }

/* Page-level states */
.state { display: grid; justify-items: start; gap: 8px; padding: 24px; background: var(--site-surface); border: 1px dashed var(--site-control-border); border-radius: 0.75rem; }
.state h2 { margin: 0; font-size: var(--text-body); }
.state p { margin: 0; color: var(--site-secondary-text); font-size: var(--text-small); }
.banner { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 12px 16px; border-radius: 0.6rem; border: 1px solid var(--site-control-border); background: var(--site-raised); font-size: var(--text-small); margin: 16px 0; }
.banner[data-tone="danger"] { border-color: var(--site-danger); }
.banner[data-tone="warning"] { border-color: var(--site-warning); }
.banner p { margin: 0; flex: 1 1 240px; }
.skel { background: linear-gradient(90deg, var(--site-tint), var(--site-raised), var(--site-tint)); border-radius: 6px; height: 12px; }
.skel-card { background: var(--site-surface); border: 1px solid var(--site-border); border-radius: 0.6rem; padding: 16px; display: grid; gap: 12px; }
.rules-list { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; font-size: var(--text-small); color: var(--site-secondary-text); }

/* Rules dialog: modal on desktop, bottom sheet on narrow viewports. Esc and the close button dismiss it;
   focus returns to the button that opened it. */
.pk-dialog { width: min(34rem, calc(100% - 32px)); max-height: calc(100dvh - 64px); padding: 0; border: 1px solid var(--site-control-border);
  border-radius: 0.75rem; background: var(--site-surface); color: var(--site-foreground); box-shadow: 0 16px 40px var(--site-shadow); }
.pk-dialog::backdrop { background: #0006; }
.pk-dialog-inner { display: grid; gap: 12px; padding: 20px; }
.pk-dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.pk-dialog-head h2 { margin: 0; font-size: var(--text-heading); }
.pk-dialog .rules-list { font-size: var(--text-small); gap: 8px; }
.pk-dialog-foot { display: flex; justify-content: flex-end; }
@media (max-width: 560px) {
  .pk-dialog { width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 0.75rem 0.75rem 0 0; }
}

/* Leaderboard: own rank when the row is outside the loaded page */

let LANG = "zh-Hans";
function t(key, vars = {}) {
  const entry = COPY[key];
  if (!entry) return `⟦${key}⟧`;
  return entry[LANG].replace(/\{(\w+)\}/g, (_, k) => (k in vars ? vars[k] : `{${k}}`));
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
/* Same output as formatDate() in src/lib/editions.ts: medium date, 24-hour time and the edition offset.
   Synthetic data is written as edition wall-clock time (Asia/Shanghai, UTC+8). */
const TZ = "Asia/Shanghai";
function fmt(local) {
  const d = new Date(`${local.replace(" ", "T")}:00+08:00`);
  const text = new Intl.DateTimeFormat(LANG, { timeZone: TZ, dateStyle: "medium", timeStyle: "short", hourCycle: "h23" }).format(d).replace(/\s+/g, " ");
  return `<time datetime="${d.toISOString()}">${text} (UTC+8)</time>`;
}

const nameOf = (key) => (key === "draw" ? t("draw") : TEAMS[key]);
function duration(left) {
  if (left.d != null) return t("dur_dh", { d: left.d, h: left.h });
  if (left.h != null) return t("dur_hm", { h: left.h, m: left.m });
  return t("dur_m", { m: left.m });
}
function badge(f) {
  const map = {
    open: f.saved && f.pick === f.saved && !f.error ? ["success", "check", "status_saved"] : ["accent", "dot", "status_open"],
    closing: ["warning", "clock", "status_closing"],
    closed: ["muted", "lock", "status_closed"],
    awaiting: ["warning", "hourglass", "status_awaiting"],
    settled: ["success", "check", "status_settled"],
    voided: ["danger", "ban", "status_voided"],
  };
  if (f.visitor) return `<span class="badge" data-tone="accent">${ICON.dot}${t("status_open")}</span>`;
  const [tone, icon, key] = map[f.state];
  return `<span class="badge" data-tone="${tone}">${ICON[icon]}${t(key)}</span>`;
}
function times(f) {
  const parts = [`<span>${t("starts_at", { time: fmt(f.starts) })}</span>`];
  if (f.state === "open" || f.state === "closing") {
    parts.push(`<span><b>${t("closes_at", { time: fmt(f.closes) })}</b></span>`);
    // The countdown is a visual aid only; the closing time above is the authoritative text.
    if (f.state === "open") parts.push(`<span class="rel" aria-hidden="true">${t("time_left", { duration: duration(f.left) })}</span>`);
  } else {
    parts.push(`<span>${t("closed_at", { time: fmt(f.closes) })}</span>`);
  }
  return `<div class="pk-times">${parts.join("")}</div>`;
}

    return `<label class="pk-option${isDraw ? " draw" : ""}">
      <input type="radio" name="${uid}" value="${key}" ${checked} ${disabled ? "disabled" : ""} data-focus="${uid}-${key}" />

  const skel = `<div class="skel-card" aria-hidden="true"><div class="skel" style="width:40%"></div><div class="skel" style="width:70%"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="skel" style="height:44px"></div><div class="skel" style="height:44px"></div></div></div>`;
  const body = {
    loading: `<div aria-busy="true"><p class="sr-only" role="status">${t("x_loading")}</p>${skel}${skel}</div>`,
    noopen: `<div class="state">${ICON.info}<h2>${t("empty_open_title")}</h2><p>${t("empty_open_body")}</p><a class="btn secondary" href="#">${t("view_schedule")}</a></div>`,
    filter: `<div class="state"><h2>${t("empty_filter_title")}</h2><button class="btn secondary" type="button">${t("show_all")}</button></div>`,
    nopicks: `<div class="state"><h2>${t("mine_empty_title")}</h2><p>${t("mine_empty_body")}</p><a class="btn primary" href="#">${t("go_open")}</a></div>`,
    lbempty: `<div class="state"><h2>${t("lb_empty_title")}</h2><p>${t("lb_empty_body")}</p></div>`,
    failed: `<div class="state" role="alert">${ICON.alert}<h2>${t("load_failed_title")}</h2><p>${t("load_failed_body")}</p><button class="btn secondary" type="button">${t("x_retry")}</button></div>`,
    session: `<div class="banner" data-tone="danger" role="alert">${ICON.alert}<p>${t("session_banner")}</p><a class="btn primary" href="#">${t("x_signin_again")}</a></div>`,
    ineligible: `<div class="banner" data-tone="warning" role="status">${ICON.info}<p>${t("ineligible_banner")}</p></div>`,
    refreshed: `<div class="banner" role="status">${ICON.info}<p>${t("refreshed_banner")}</p></div>`,
    vispending: `<section class="panel"><div class="switch-row"><div><h2>${t("vis_title")}</h2></div><button type="button" class="switch" role="switch" aria-checked="true" aria-busy="true"></button></div><p class="small" role="status" style="margin:0">${t("vis_saving")}</p></section>`,
    visconflict: `<section class="panel"><div class="switch-row"><div><h2>${t("vis_title")}</h2></div><button type="button" class="switch" role="switch" aria-checked="false"></button></div><p class="small" role="status" style="margin:0;color:var(--site-warning)">${ICON.info} ${t("vis_conflict")}</p></section>`,
    visitormine: `<div class="state"><h2>${t("tab_mine")}</h2><p>${t("visitor_mine")}</p><a class="btn primary" href="#">${t("x_continue_osu")}</a></div>`,
    visitorboard: `<div class="state"><h2>${t("tab_board")}</h2><p>${t("visitor_board")}</p><a class="btn primary" href="#">${t("x_continue_osu")}</a></div>`,
    visfailed: `<section class="panel"><div class="switch-row"><div><h2>${t("vis_title")}</h2></div><button type="button" class="switch" role="switch" aria-checked="false"></button></div><p class="small" role="alert" style="margin:0;color:var(--site-danger)">${ICON.alert} ${t("vis_failed")}</p><button class="btn secondary" type="button" style="justify-self:start">${t("x_retry")}</button></section>`,
    rules: `<div class="pk-dialog static" role="dialog" aria-labelledby="static-rules-title">${rulesDialogBody("static-rules-title")}</div>`,
  }[kind];
  if (kind === "menu") return `<div style="min-height:340px;margin:-12px">${contextBar({ open: true })}</div>`;
  return `<div class="pk" style="padding:0">${body}</div>`;
}

/* ------------------------------ board layout ------------------------------ */
const STORE = {};
const FRAMES = {};
function frame(label, cls, id, build) {
  FRAMES[id] = build;
  return `<div class="frame-wrap"><div class="frame-label">${label}</div><div class="frame ${cls}" data-frame="${id}">${build()}</div></div>`;
}
function rerenderFrame(id, focusSelector) {
  const el = document.querySelector(`[data-frame="${id}"]`);
  el.innerHTML = FRAMES[id]();
  const target = focusSelector && el.querySelector(focusSelector);
  if (target) target.focus();
  return el;
}
function render() {
  document.documentElement.lang = LANG;
  const gallery = GALLERY.map(([code, title, note, f]) => {
    const g = { ...f, uid: `g-${code}` };
    STORE.g = STORE.g || {};
    STORE.g[g.uid] = STORE.g[g.uid] ? { ...g, ...pickState(STORE.g[g.uid]) } : g;
    return `<figure><figcaption><code>${code}</code> ${title}<br><span style="opacity:.75">${note}</span></figcaption><div class="frame mobile" style="width:400px">${card(STORE.g[g.uid])}</div></figure>`;
  }).join("");
  const states = [
    ["loading", "加载中（骨架 + aria-busy）"], ["noopen", "无开放场次"], ["filter", "筛选无结果"], ["nopicks", "我的预测为空"],
    ["lbempty", "排行榜尚无结算"], ["failed", "加载失败"], ["session", "登录失效横幅（页首下方）"], ["ineligible", "不符合参与资格（只读）"],
    ["refreshed", "局部刷新后提示（截止、改期、冲突后拉取新数据）"], ["vispending", "榜单显示设置 · 更新中"], ["visconflict", "榜单显示设置 · 版本冲突"], ["visfailed", "榜单显示设置 · 更新失败（开关回到原状态）"], ["visitormine", "访客点开“我的预测”"], ["visitorboard", "访客点开“排行榜”"],
    ["rules", "玩法说明（桌面为对话框，手机为底部面板；Esc 或关闭按钮收起，焦点回到“玩法”按钮）"], ["menu", "手机赛事菜单（活动启用时末尾出现“赛事预测”）"],
  ].map(([k, label]) => `<figure><figcaption><code>${k}</code> ${label}</figcaption><div class="frame mobile" style="width:400px;padding:12px">${statesFrame(k)}</div></figure>`).join("");

  document.getElementById("board").innerHTML = `
  <section class="board-section" data-shot="matches-desktop"><h2>1 · 本轮场次（已登录 · 桌面 ≥ 900px）</h2>
    <p class="lede">主区按“可预测 → 已截止 → 已结算与作废”分组；右侧 320px 固定宽度侧栏放我的进度、榜单摘要与玩法摘要。第一张卡可直接操作：选择 → 保存（勾选顶部“模拟保存失败”可看失败与重试）。页首“玩法”打开完整规则对话框。</p>
    <div class="frames">${frame("desktop · 1200px", "desktop", "d", () => matchesPage("d"))}</div></section>
  <section class="board-section" data-shot="matches-mobile"><h2>2 · 本轮场次（手机 390px）</h2>
    <p class="lede">单栏顺序：页首与分页签 → 筛选（轮次、状态、已预测计数）→ 场次清单 → 我的进度 → 榜单摘要。完整排行榜从页首“排行榜”分页签进入。赛事导航收进“赛事菜单”，可点开。</p>
    <div class="frames">${frame("mobile · 390px", "mobile", "m", () => matchesPage("m"))}</div></section>
  <section class="board-section" data-shot="cards"><h2>3 · 场次卡完整状态</h2>
    <p class="lede">同一张卡在不同阶段的样子。状态同时用文字、图标与既有色票表示；比例只在服务器确认截止后出现。时间沿用站内 formatDate 格式（日期、24 小时制与赛季时区偏移）。</p>
    <div class="gallery">${gallery}</div></section>
  <section class="board-section" data-shot="mine"><h2>4 · 我的预测</h2>
    <p class="lede">列出所选结果、实际赛果与得分。改判与作废显示当前状态和赛果链接。手机把表格转为逐行卡片。</p>
    <div class="frames">${frame("desktop · 1200px", "desktop", "dm", () => minePage("dm"))}${frame("mobile · 390px", "mobile", "mm", () => minePage("mm"))}</div></section>
  <section class="board-section" data-shot="board"><h2>5 · 排行榜与显示设置</h2>
    <p class="lede">本轮 / 全季可切换（全季隐藏轮次选单）；同分同名次并标“并列”；“猜中”列显示猜中数 / 已结算的预测数。本人行高亮，“定位到我”把焦点移到本人行。本人不在当前页时，底部固定显示本人名次，点“定位到我”载入本人所在位置。显示开关可撤回，说明使用站内 osu! 公开名称；点开关可看更新中状态与榜单变化。</p>
    <div class="frames">${frame("desktop · listed", "desktop", "dl", () => boardPage("dl"))}${frame("mobile · not listed", "mobile", "ml", () => boardPage("ml", { listed: false }))}${frame("mobile · listed · 本人第 57 名（不在第一页）", "mobile", "mf", () => boardPage("mf", { far: true }))}</div></section>
  <section class="board-section" data-shot="visitor"><h2>6 · 访客</h2>
    <p class="lede">访客看到玩法与开放场次摘要，以及 osu! 登录入口；登录后回到同一赛季的预测页。不显示个人预测、比例或完整榜单。</p>
    <div class="frames">${frame("desktop · visitor", "desktop", "dv", () => matchesPage("dv", { visitor: true }))}${frame("mobile · visitor", "mobile", "mv", () => matchesPage("mv", { visitor: true }))}</div></section>
  <section class="board-section" data-shot="states"><h2>7 · 页面级状态</h2>
    <div class="gallery">${states}</div></section>`;
}
function pickState(s) { return { pick: s.pick, saved: s.saved, savedAt: s.savedAt, saving: s.saving, error: s.error, state: s.state, dist: s.dist }; }

/* ---------------------------- demo interaction ---------------------------- */
function findCard(uid) {
  for (const bucket of Object.values(STORE)) if (bucket[uid]) return bucket;
  return null;
}
function rerenderCard(uid, announce) {
  const bucket = findCard(uid);
  const el = document.querySelector(`[data-card="${uid}"] .pk-card-body`);
  const focusId = document.activeElement?.dataset?.focus;
  el.innerHTML = cardBody(bucket[uid]);
  const target = focusId && el.querySelector(`[data-focus="${focusId}"]`);
  if (target) target.focus();
  if (announce != null) document.querySelector(`[data-live="${uid}"]`).textContent = announce;
}
function announce(text) {
  const live = document.getElementById("board-live");
  live.textContent = "";
  setTimeout(() => { live.textContent = text; }, 50);
}
let rulesOpener = null;
const rulesDialog = document.getElementById("rules-dialog");
rulesDialog.addEventListener("close", () => { rulesOpener?.focus(); rulesOpener = null; });
rulesDialog.addEventListener("click", (e) => { if (e.target === rulesDialog) rulesDialog.close(); });
document.addEventListener("change", (e) => {
  const input = e.target.closest(".pk-option input");
  if (!input) return;
  const uid = input.name; const bucket = findCard(uid); const f = bucket[uid];
  f.pick = input.value; f.error = null;
  rerenderCard(uid, "");
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  const ctx = e.target.closest?.(".ctx[data-open]");
  if (!ctx) return;
  e.preventDefault();
  ctx.removeAttribute("data-open");
  const btn = ctx.querySelector("[data-menu]");
  btn.setAttribute("aria-expanded", "false"); btn.querySelector("span").textContent = "+"; btn.focus();
});
document.addEventListener("click", (e) => {
  const save = e.target.closest("[data-save]");
  if (save && save.getAttribute("aria-disabled") !== "true") {
    const uid = save.closest("[data-card]").dataset.card; const f = findCard(uid)[uid];
    f.saving = true; f.error = null; rerenderCard(uid, t("live_saving"));
    setTimeout(() => {
      f.saving = false;
      if (document.getElementById("fail").checked) { f.error = "err_network"; rerenderCard(uid, ""); }
      else { f.saved = f.pick; f.savedAt = "2026-11-27 21:05"; rerenderCard(uid, t("live_saved", { team: nameOf(f.pick) })); }
    }, 900);
  }
  const rules = e.target.closest("[data-rules]");
  if (rules) {
    rulesDialog.innerHTML = rulesDialogBody("rules-title");
    rulesOpener = rules; rulesDialog.showModal();
  }
  if (e.target.closest("[data-close-rules]") && rulesDialog.open) rulesDialog.close();
  const menu = e.target.closest("[data-menu]");
  if (menu) {
    const ctx = menu.closest(".ctx"); const open = !ctx.hasAttribute("data-open");
    ctx.toggleAttribute("data-open", open);
    menu.setAttribute("aria-expanded", String(open)); menu.querySelector("span").textContent = open ? "−" : "+";
  }
  const scope = e.target.closest("[data-scope]");
  if (scope) {
    const id = scope.dataset.board; const s = BSTATE[id];
    if (s.scope !== scope.dataset.scope) {
      s.scope = scope.dataset.scope; s.jumped = false;
      rerenderFrame(id, `[data-scope="${s.scope}"]`);
      announce(t(s.scope === "season" ? "board_season" : "board_summary"));
    }
  }
  const jump = e.target.closest("[data-jump]");
  if (jump) {
    const id = jump.dataset.jump; const s = BSTATE[id];
    if (s.far && !s.jumped) { s.jumped = true; rerenderFrame(id); }
    const row = document.querySelector(`[data-frame="${id}"] tr[data-me]`);
    if (row) {
      row.scrollIntoView({ block: "center" }); row.focus({ preventScroll: true });
      const rank = (s.far ? BOARDS.farAround : BOARDS[s.scope]).find((r) => r[4])[0];
      announce(t("lb_jumped", { rank }));
    }
  }
  const top = e.target.closest("[data-top]");
  if (top) { const id = top.dataset.top; BSTATE[id].jumped = false; rerenderFrame(id, "[data-jump]"); }
  const sw = e.target.closest("[data-switch]");
  if (sw && sw.getAttribute("aria-busy") !== "true") {
    const id = sw.dataset.switch; const s = BSTATE[id];
    s.pending = true; rerenderFrame(id, "[data-switch]");
    setTimeout(() => {
      s.pending = false; s.listed = !s.listed; s.jumped = false;
      rerenderFrame(id, "[data-switch]");
    }, 700);
  }
});
document.getElementById("lang").addEventListener("change", (e) => { LANG = e.target.value; render(); });
document.getElementById("theme").addEventListener("change", (e) => { document.documentElement.dataset.theme = e.target.value; });
const params = new URLSearchParams(location.search);
if (params.get("lang")) { LANG = params.get("lang"); document.getElementById("lang").value = LANG; }
if (params.get("theme")) { document.documentElement.dataset.theme = params.get("theme"); document.getElementById("theme").value = params.get("theme"); }
render();
</script>
</body>

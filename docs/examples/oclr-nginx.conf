# Install on the EXISTING Nginx host, inside the http {} context (conf.d).
# Example values only: replace the domain, app private IP and certificate paths.
# Node runs on a DIFFERENT host. Do not use 127.0.0.1 here.
upstream oclr_app {
    server 192.0.2.20:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name oclr.example.com;
    return 308 https://oclr.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name oclr.example.com;
    ssl_certificate /etc/nginx/tls/oclr-fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/oclr-private.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Allow an 8 MiB replay plus bounded multipart overhead (team images remain 5 MB).
    # App JSON handlers retain smaller per-operation limits; image bytes/pixels are bounded server-side.
    client_max_body_size 9m;
    client_body_timeout 15s;

    # Proxy locations inherit the same upstream headers and private cache policy.
    expires off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host oclr.example.com;
    proxy_set_header X-Forwarded-Host oclr.example.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Real-IP $remote_addr;
    # This example is the public edge; discard a client-supplied chain.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    # Preserve streamed responses and Next.js Cache-Control, ETag, Vary and security headers.
    proxy_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;

    location ~ ^/api/admin/tournaments/[A-Za-z0-9-]+/mappools/entries/[A-Fa-f0-9-]+/beatmap-cache/?$ {
        client_max_body_size 65m;
        proxy_pass http://oclr_app;
    }

    # Enable after configuring the Liru Bot daemon on the Rocky application host.
    # Use its private IP and the LIRU_BOT_PORT configured in liru-bot.env.
    # location = /interactions {
    #     client_max_body_size 32k;
    #     proxy_pass_request_headers on;
    #     proxy_pass_request_body on;
    #     proxy_pass http://192.0.2.20:9312;
    # }

    location / {
        proxy_pass http://oclr_app;
    }
}
